name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    name: Create Release PR
    # GITHUB_TOKEN defaults to read-only in this repo. peter-evans needs
    # `contents: write` to push the release branch, and `pull-requests: write`
    # to open the PR. The repo-level "Allow GitHub Actions to create and
    # approve pull requests" toggle (Settings → Actions → General) must also
    # be enabled — see PR description.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test
        run: pnpm build && pnpm test

      - name: Create changeset
        run: |
          cat > .changeset/release-${{ github.run_id }}.md << 'EOF'
          ---
          "@zambit/elevate-ts": ${{ github.event.inputs.bump }}
          ---
          Release version bump: ${{ github.event.inputs.bump }}
          EOF

      - name: Version packages
        run: pnpm changeset:version

      # changeset's default changelog generator writes `### Minor Changes` /
      # `### Patch Changes` without a per-version suffix, but the project's
      # CHANGELOG convention (see commit 13eeb15) requires each heading to be
      # unique. Without this step, lint-staged blocks the release commit on
      # MD024 duplicate-heading errors. Idempotent and conservative — only
      # touches unsuffixed headings.
      - name: Disambiguate CHANGELOG headings
        run: pnpm fix:changelog

      - name: Create Release PR
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'release: version packages'
          title: 'release: version packages'
          body: |
            This PR bumps the version and updates CHANGELOG.md.
            
            When merged, the GitHub Actions `publish.yml` workflow will publish to npm.
          branch: release/${{ github.run_id }}
          delete-branch: true
