name: Publish to npm

on:
  push:
    tags:
      # Matches what `changeset publish` creates by default (and what 0.4.x / 0.5.x used).
      # Commercial publishes use the same prefix with a `-commercial` suffix,
      # which is detected below via the existing endsWith check on github.ref.
      - '@zambit/elevate-ts@*'

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish to npm
    # NPM_TOKEN lives on the `prod` GitHub environment, not as a repo-level
    # secret. Declaring the environment here is what makes secrets.NPM_TOKEN
    # resolve. Also creates a deployment record per release for audit.
    environment: prod
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Determine license (AGPL vs Commercial)
        id: license
        run: |
          TAG="${{ github.ref }}"
          if [[ $TAG == *"-commercial" ]]; then
            echo "type=commercial" >> $GITHUB_OUTPUT
          else
            echo "type=agpl" >> $GITHUB_OUTPUT
          fi

      - name: Publish AGPL version
        if: steps.license.outputs.type == 'agpl'
        run: npm publish --tag agpl --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Commercial version
        if: steps.license.outputs.type == 'commercial'
        run: pnpm exec tsx scripts/publish-commercial.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
